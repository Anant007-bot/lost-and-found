services:
  - type: web
    name: lost-and-found-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL      # paste your Neon connection string in the Render dashboard
        sync: false
      - key: CORS_ORIGINS      # e.g. https://YOURNAME.github.io
        sync: false
      - key: ADMIN_KEY         # any long random string
        sync: false
